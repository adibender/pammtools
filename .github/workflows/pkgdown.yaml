# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# Not run on pull_request: the site is only deployed from main/master, and
# R-CMD-check already builds the vignettes on PRs. Building the full site
# (JAGS + a brms/Stan compile) for an artifact that is thrown away doubled
# the CI time of every PR that was merged shortly after.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Install JAGS (system dependency for rjags)
        run: |
          sudo apt-get update
          sudo apt-get install -y jags

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # brms compiles its Stan model with the rstan backend at render time,
          # which needs the Boost (BH) and Eigen (RcppEigen) headers. These are
          # LinkingTo-only deps of rstan, so pak does not install them when
          # installing the rstan *binary*; request them explicitly here.
          extra-packages: any::pkgdown, any::rjags, any::brms, any::rstan, any::BH, any::RcppEigen, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: false
          branch: gh-pages
          folder: docs
